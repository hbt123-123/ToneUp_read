name: daily-release

on:
  schedule:
    # UTC 20:00 = 次日 04:00（Asia/Shanghai）
    - cron: '0 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check required secrets
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ARTICLE_API_KEY: ${{ secrets.ARTICLE_API_KEY }}
          GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
        run: |
          missing=""
          for name in ANDROID_KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ARTICLE_API_KEY GATEWAY_KEY; do
            if [ -z "${!name}" ]; then
              missing="$missing $name"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::缺少仓库 Secrets:$missing"
            echo "请在 Settings → Secrets and variables → Actions 中补齐后重试。"
            exit 1
          fi

      - name: Detect changes since last release
        id: detect
        run: |
          git fetch --tags --force
          LAST_TAG="$(git tag --list 'v*' --sort=-version:refname | head -n 1)"
          echo "last_tag=$LAST_TAG" >> "$GITHUB_OUTPUT"
          if [ -z "$LAST_TAG" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "还没有发布 tag，按首次发布处理。"
            exit 0
          fi
          if git diff --quiet "$LAST_TAG"..HEAD -- lib android assets pubspec.yaml pubspec.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "自 $LAST_TAG 以来没有发布相关的源码变化，跳过本次发布。"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "检测到 $LAST_TAG 之后的变化："
            git diff --name-only "$LAST_TAG"..HEAD -- lib android assets pubspec.yaml pubspec.lock
          fi

      - name: Compute next version
        if: steps.detect.outputs.changed == 'true'
        id: version
        env:
          LAST_TAG: ${{ steps.detect.outputs.last_tag }}
        run: |
          CUR="$(awk '/^version:/{print $2; exit}' pubspec.yaml)"
          NAME="${CUR%%+*}"
          CODE="${CUR##*+}"

          if [ -z "$LAST_TAG" ]; then
            LA=0; LB=0; LC=0; LAST_CODE=0
          else
            BASE="${LAST_TAG#v}"; BASE="${BASE%%+*}"
            LA="${BASE%%.*}"; REST="${BASE#*.}"
            LB="${REST%%.*}"; LC="${REST#*.}"
            [ "$LC" = "$REST" ] && LC=0
            LAST_CODE=$((10#$LA * 100 + 10#$LB * 10 + 10#$LC))
          fi

          if [ "$CODE" -gt "$LAST_CODE" ]; then
            TARGET_NAME="$NAME"
            TARGET_CODE="$CODE"
          else
            MAJOR=$((10#$LA)); MINOR=$((10#$LB)); PATCH=$((10#$LC + 1))
            if [ "$PATCH" -ge 10 ]; then PATCH=0; MINOR=$((MINOR + 1)); fi
            if [ "$MINOR" -ge 100 ]; then MINOR=0; MAJOR=$((MAJOR + 1)); fi
            TARGET_NAME="$MAJOR.$MINOR.$PATCH"
            TARGET_CODE=$((MAJOR * 100 + MINOR * 10 + PATCH))
          fi

          if [ "$TARGET_CODE" -le "$LAST_CODE" ]; then
            echo "::error::计算出的 versionCode $TARGET_CODE 没有大于上一版 $LAST_CODE"
            exit 1
          fi

          sed -i -E "s/^version:.*/version: ${TARGET_NAME}+${TARGET_CODE}/" pubspec.yaml
          echo "name=$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$TARGET_CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$TARGET_NAME" >> "$GITHUB_OUTPUT"
          echo "本次目标版本：v$TARGET_NAME（versionCode $TARGET_CODE）"

      - name: Prepare release notes
        if: steps.detect.outputs.changed == 'true'
        env:
          LAST_TAG: ${{ steps.detect.outputs.last_tag }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if grep -q "^## $TAG" release-notes.md; then
            echo "release-notes.md 已有 $TAG 的手写说明，直接沿用。"
            exit 0
          fi

          RANGE="${LAST_TAG:+$LAST_TAG..}HEAD"
          {
            echo "## $TAG"
            echo
            git log --no-merges --pretty=format:'- %s' "$RANGE" -- lib android assets pubspec.yaml pubspec.lock \
              | grep -vE 'chore\(release\)' || true
          } > /tmp/release-notes.md

          if [ "$(grep -c '^- ' /tmp/release-notes.md || true)" -eq 0 ]; then
            {
              echo "## $TAG"
              echo
              echo "- 维护性更新，无用户可见变化"
            } > /tmp/release-notes.md
          fi
          mv /tmp/release-notes.md release-notes.md

      - name: Set up JDK 17
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        if: steps.detect.outputs.changed == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.9'
          channel: stable
          cache: true

      - name: Configure signing
        if: steps.detect.outputs.changed == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # 该签名库为 PKCS12，密钥口令与库口令相同，因此统一使用库口令。
          # 同时去掉复制时可能带入的首尾空白/换行，避免 keytool 读取失败。
          STORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | sed -E 's/^[[:space:]]+//; s/[[:space:]]+$//')"
          KEY_ALIAS="$(printf '%s' "$ANDROID_KEY_ALIAS" | tr -d '[:space:]')"
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=toneup-release.jks\n' \
            "$STORE_PASSWORD" "$STORE_PASSWORD" "$KEY_ALIAS" > android/key.properties
          echo "$ANDROID_KEYSTORE_B64" | tr -d '[:space:]' | base64 --decode > android/app/toneup-release.jks
          test -s android/app/toneup-release.jks

          echo "Keystore bytes: $(stat -c %s android/app/toneup-release.jks)（正确值应为 4376）"
          ACTUAL_BYTES=$(stat -c %s android/app/toneup-release.jks)
          if [ "$ACTUAL_BYTES" -ne 4376 ]; then
            echo "::error::ANDROID_KEYSTORE_B64 不完整：解码后 ${ACTUAL_BYTES} 字节，应为 4376 字节（请重新完整粘贴单行 Base64）"
            exit 1
          fi
          keytool -list -keystore android/app/toneup-release.jks -storepass "$STORE_PASSWORD" | sed -n '1,8p'

          # 构建前验证别名和口令，失败时立即报错，不必等 Gradle 跑完。
          keytool -importkeystore \
            -srckeystore android/app/toneup-release.jks \
            -srcstorepass "$STORE_PASSWORD" \
            -srcalias "$KEY_ALIAS" \
            -srckeypass "$STORE_PASSWORD" \
            -destkeystore /tmp/keystore-preflight.p12 \
            -deststoretype PKCS12 \
            -deststorepass preflight \
            -destkeypass preflight \
            -noprompt

      - name: Test and build APK
        if: steps.detect.outputs.changed == 'true'
        env:
          ARTICLE_API_KEY: ${{ secrets.ARTICLE_API_KEY }}
          GATEWAY_KEY: ${{ secrets.GATEWAY_KEY }}
        run: |
          flutter pub get
          flutter analyze || echo "::warning::flutter analyze 有告警，不阻塞发布"
          flutter test
          flutter build apk --release \
            --build-name="${{ steps.version.outputs.name }}" \
            --build-number="${{ steps.version.outputs.code }}" \
            --dart-define=ARTICLE_API_KEY="$ARTICLE_API_KEY" \
            --dart-define=GATEWAY_KEY="$GATEWAY_KEY"

      - name: Generate release assets
        if: steps.detect.outputs.changed == 'true'
        run: |
          APK="build/app/outputs/flutter-apk/app-release.apk"
          test -f "$APK"
          mkdir -p dist
          cp "$APK" dist/ToneUP-read.apk
          SHA="$(sha256sum dist/ToneUP-read.apk | awk '{print $1}')"
          SIZE="$(stat -c %s dist/ToneUP-read.apk)"
          jq -n \
            --arg version "${{ steps.version.outputs.name }}" \
            --argjson versionCode "${{ steps.version.outputs.code }}" \
            --arg url "https://github.com/hbt123-123/ToneUp_read/releases/latest/download/ToneUP-read.apk" \
            --arg sha256 "$SHA" \
            --argjson size "$SIZE" \
            --arg notes "$(cat release-notes.md)" \
            '{version:$version,versionCode:$versionCode,url:$url,sha256:$sha256,size:$size,notes:$notes}' \
            > dist/version.json
          cat dist/version.json

      - name: Commit version bump
        if: steps.detect.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pubspec.yaml release-notes.md
          if git diff --cached --quiet; then
            echo "版本变更已在上一次运行中提交，跳过重复提交。"
          else
            git commit -m "chore(release): ${{ steps.version.outputs.tag }} [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publish GitHub Release
        if: steps.detect.outputs.changed == 'true'
        run: |
          gh release create "${{ steps.version.outputs.tag }}" \
            dist/ToneUP-read.apk dist/version.json \
            --target "$(git rev-parse HEAD)" \
            --title "${{ steps.version.outputs.tag }}" \
            --notes-file release-notes.md \
            --latest \
            --repo hbt123-123/ToneUp_read

      - name: Verify fixed update URL
        if: steps.detect.outputs.changed == 'true'
        run: |
          for i in {1..6}; do
            if curl -fsSL "https://github.com/hbt123-123/ToneUp_read/releases/latest/download/version.json" \
              | jq -e --arg v "${{ steps.version.outputs.name }}" \
                  --argjson c "${{ steps.version.outputs.code }}" \
                  '.version == $v and .versionCode == $c' >/dev/null; then
              echo "固定更新链接校验通过：v${{ steps.version.outputs.name }}"
              exit 0
            fi
            sleep 10
          done
          echo "::error::releases/latest 未在预期时间内指向新版本"
          exit 1
